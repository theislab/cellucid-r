# Builds the source package tarball, runs `R CMD check --as-cran` on it and,
# for a published GitHub Release, submits that exact tarball to CRAN.
#
# - Publishing a GitHub Release tagged `vX.Y.Z` (X.Y.Z = DESCRIPTION's
#   Version, on main) builds, checks, attaches the tarball to the release and
#   submits it to CRAN with `cran-comments.md` as the comment. A check with a
#   WARNING or an ERROR is not submitted.
# - CRAN then emails the maintainer in DESCRIPTION a confirmation link; the
#   submission goes ahead only once the maintainer clicks it (CRAN's rule).
# - Running the workflow by hand builds and checks only; it never submits.

name: Build Release Tarball

on:
  workflow_dispatch:
    inputs:
      run_as_cran:
        description: "Run R CMD check --as-cran (recommended for CRAN submission)"
        required: false
        default: "true"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Verify release tag and main-branch provenance
        if: github.event_name == 'release'
        run: |
          VERSION="$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1, "Version"])')"
          EXPECTED_TAG="v${VERSION}"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_TAG}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
        shell: bash

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Ensure pdflatex is available
        run: |
          if ! command -v pdflatex >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          fi
          pdflatex --version
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools, any::httr2, local::.
          needs: check

      - name: Build source tarball
        id: build
        run: |
          PACKAGE="$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1, "Package"])')"
          VERSION="$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1, "Version"])')"
          TARBALL="${PACKAGE}_${VERSION}.tar.gz"
          R CMD build .
          test -f "./${TARBALL}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${TARBALL}.sha256" >> "${GITHUB_OUTPUT}"
          echo "Built: ${TARBALL}"
        shell: bash

      - name: R CMD check (default)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_as_cran != 'true'
        run: |
          R CMD check "${{ steps.build.outputs.tarball }}"
        shell: bash

      - name: R CMD check --as-cran
        if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_as_cran == 'true')
        run: |
          R CMD check --as-cran "${{ steps.build.outputs.tarball }}"
        shell: bash

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: r-source-tarball
          path: |
            ${{ steps.build.outputs.tarball }}
            ${{ steps.build.outputs.checksum }}

      - name: Attach tarball to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build.outputs.tarball }}
            ${{ steps.build.outputs.checksum }}

      - name: Refuse a CRAN submission over a warning or an error
        if: github.event_name == 'release'
        run: |
          STATUS="$(grep -E '^Status:' cellucid.Rcheck/00check.log)"
          echo "R CMD check --as-cran: ${STATUS}"
          if grep -qE 'ERROR|WARNING' <<< "${STATUS}"; then
            echo "::error::R CMD check --as-cran reported '${STATUS}'; not submitted to CRAN."
            exit 1
          fi
        shell: bash

      # devtools' own upload (the two-step form devtools::submit_cran() posts,
      # without its interactive questions): the comment is cran-comments.md,
      # the maintainer's name and email come from DESCRIPTION.
      - name: Submit the checked tarball to CRAN
        if: github.event_name == 'release'
        run: |
          Rscript -e 'devtools:::upload_cran(pkg = ".", built_path = "${{ steps.build.outputs.tarball }}")'
          echo "::notice::Submitted ${{ steps.build.outputs.tarball }} to CRAN. Confirm it from the email CRAN sends the maintainer."
        shell: bash

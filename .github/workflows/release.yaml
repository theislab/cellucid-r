# Publishing a GitHub Release named `vX.Y.Z` (X.Y.Z = DESCRIPTION's Version,
# its tag on main) is the one way to release the R package. This workflow then
# builds the source tarball, runs `R CMD check --as-cran` on it, attaches the
# tarball and its SHA-256 to the release and submits that exact tarball to
# CRAN with `cran-comments.md` as the comment.
#
# - It runs on `release: published` only: a tag push, a draft release and a
#   release marked pre-release publish nothing (CRAN takes final X.Y.Z
#   versions only).
# - A check with a WARNING or an ERROR is not submitted.
# - CRAN then emails the maintainer in DESCRIPTION a confirmation link; the
#   submission goes ahead only once the maintainer clicks it (CRAN's rule).
# - A failed run is retried with "Re-run jobs" on that run.

name: Publish to CRAN

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: cran-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the release, its tag and main-branch provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION="$(sed -n 's/^Version: //p' DESCRIPTION)"
          EXPECTED_TAG="v${VERSION}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::DESCRIPTION's Version '${VERSION}' is not a final X.Y.Z version; CRAN is never sent a pre-release."
            exit 1
          fi
          if [[ "${RELEASE_DRAFT}" != "false" ]]; then
            echo "::error::A draft release is never published."
            exit 1
          fi
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::The release is marked pre-release, but ${VERSION} is a final version: untick 'Set as a pre-release'."
            exit 1
          fi
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${RELEASE_TAG}" = "${GITHUB_REF_NAME}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_TAG}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Ensure pdflatex is available
        run: |
          if ! command -v pdflatex >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          fi
          pdflatex --version
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools, any::httr2, local::.
          needs: check

      - name: Build source tarball
        id: build
        run: |
          PACKAGE="$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1, "Package"])')"
          VERSION="$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1, "Version"])')"
          TARBALL="${PACKAGE}_${VERSION}.tar.gz"
          R CMD build .
          test -f "./${TARBALL}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${TARBALL}.sha256" >> "${GITHUB_OUTPUT}"
          echo "Built: ${TARBALL}"
        shell: bash

      - name: R CMD check --as-cran
        run: |
          R CMD check --as-cran "${{ steps.build.outputs.tarball }}"
        shell: bash

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: r-source-tarball
          path: |
            ${{ steps.build.outputs.tarball }}
            ${{ steps.build.outputs.checksum }}

      - name: Attach tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build.outputs.tarball }}
            ${{ steps.build.outputs.checksum }}

      - name: Refuse a CRAN submission over a warning or an error
        run: |
          STATUS="$(grep -E '^Status:' cellucid.Rcheck/00check.log)"
          echo "R CMD check --as-cran: ${STATUS}"
          if grep -qE 'ERROR|WARNING' <<< "${STATUS}"; then
            echo "::error::R CMD check --as-cran reported '${STATUS}'; not submitted to CRAN."
            exit 1
          fi
        shell: bash

      # devtools' own upload (the two-step form devtools::submit_cran() posts,
      # without its interactive questions): the comment is cran-comments.md,
      # the maintainer's name and email come from DESCRIPTION.
      - name: Submit the checked tarball to CRAN
        run: |
          Rscript -e 'devtools:::upload_cran(pkg = ".", built_path = "${{ steps.build.outputs.tarball }}")'
          echo "::notice::Submitted ${{ steps.build.outputs.tarball }} to CRAN. Confirm it from the email CRAN sends the maintainer."
        shell: bash

# Builds a source package tarball and (optionally) runs `R CMD check --as-cran`.
#
# This workflow is designed for beginners:
# - Create a GitHub Release (or run manually)
# - Download the `.tar.gz` artifact from the workflow run
# - Upload that exact tarball to CRAN, or attach it in your Bioconductor submission
#
# This does *not* auto-submit to CRAN/Bioconductor (those still require a human),
# but it automates the parts that are easy to get wrong: reproducible building
# and pre-flight checks.

name: Build Release Tarball

on:
  workflow_dispatch:
    inputs:
      run_as_cran:
        description: "Run R CMD check --as-cran (recommended for CRAN submission)"
        required: false
        default: "true"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, local::.
          needs: check

      - name: Build source tarball
        id: build
        run: |
          R CMD build .
          TARBALL="$(ls -1t *.tar.gz | head -n 1)"
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"
          echo "Built: ${TARBALL}"
        shell: bash

      - name: R CMD check (default)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_as_cran != 'true'
        run: |
          R CMD check "${{ steps.build.outputs.tarball }}"
        shell: bash

      - name: R CMD check --as-cran
        if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_as_cran == 'true')
        run: |
          R CMD check --as-cran "${{ steps.build.outputs.tarball }}"
        shell: bash

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-source-tarball
          path: ${{ steps.build.outputs.tarball }}

      - name: Attach tarball to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.tarball }}
